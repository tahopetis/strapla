name: regression

# On-demand full regression. Deliberately NOT part of ci.yml and not attached to
# the release pipeline: the owner (or the agent acting for them) dispatches it
# before a release, or whenever a full pass is wanted.
#
#   gh workflow run regression.yml -f tier=all
#   gh workflow run regression.yml -f tier=t2 -f grep=@BR-9
#
# On this device use gh-api instead:
#   gh-api -X POST /repos/tahopetis/strapla/actions/workflows/regression.yml/dispatches \
#     -d '{"ref":"main","inputs":{"tier":"all"}}'
#
# The tier selects the Playwright project; the foundation journey always runs as
# a dependency, because every later spec builds on the portfolio it creates.
# `grep` is an advanced filter: it applies to the foundation too, so narrowing it
# away starves the later tiers of data. Prefer `tier`.
on:
  # TEMPORARY bring-up trigger for this pull request only. Removed before merge:
  # the workflow is dispatch-only by design.
  pull_request:
  workflow_dispatch:
    inputs:
      tier:
        description: Which regression tier to run
        type: choice
        options:
          - all
          - t1
          - t2
          - t3
        default: all
      grep:
        description: Optional Playwright --grep filter (advanced; also filters the foundation)
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: regression-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: strapla
          POSTGRES_PASSWORD: strapla
          POSTGRES_DB: strapla
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U strapla -d strapla"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://strapla:strapla@localhost:5432/strapla
      APP_BASE_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # pnpm version comes from package.json "packageManager" (pnpm/action-setup reads it)
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm db:migrate
      - run: pnpm exec playwright install --with-deps chromium ffmpeg
      - name: Run regression
        env:
          TIER: ${{ inputs.tier }}
          GREP: ${{ inputs.grep }}
        run: |
          set -euo pipefail
          TIER="${TIER:-all}"
          args=()
          case "$TIER" in
            all) ;;
            t1) args+=(--project=foundation) ;;
            t2) args+=(--project=t2) ;;
            t3) args+=(--project=t3) ;;
            *) echo "Unknown tier: $TIER" >&2; exit 2 ;;
          esac
          if [ -n "${GREP:-}" ]; then
            args+=(--grep "$GREP")
          fi
          printf 'playwright test %s\n' "${args[*]:-<all projects>}"
          pnpm exec playwright test "${args[@]}"
      - name: Job summary
        if: always()
        env:
          TIER: ${{ inputs.tier }}
        run: node scripts/e2e-summary.mjs
      - name: Upload report and traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-regression
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
