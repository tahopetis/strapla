name: dependency-review

# PR-scoped dependency judge: only the pull request's own dependency and action
# changes are reviewed, so a newly added vulnerable package blocks the merge
# without freezing work on the existing lockfile. osv-scanner in the security
# gate still scans the whole lockfile on every PR; this adds the change-scoped
# view (and licence/action checks) that GitHub provides free for public repos.

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: dependency-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Review dependency changes
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5
        with:
          fail-on-severity: high
